<!DOCTYPE HTML>
<html>
	<head>
		<title>{{ page.title | default: "Michael Lagana's Portfolio" }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
		<link type="image/png" sizes="32x32" rel="icon" href="{{ '/images/icons8-rocket-32.png' | relative_url }}">
		<style>
        /* Flexbox container for side-by-side images */
        .image-container {
            display: flex;
            gap: 5rem; /* Controls spacing between images */
            justify-content: center; /* Centers images horizontally */
            flex-wrap: wrap; /* Stacks images on smaller screens */
            padding: 1rem; /* Optional: outer padding for container */
        }

		.image-wrapper {
            /*overflow: hidden;*/ /* Clips overflow from rotation */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Style for figure to control image and caption */
        figure {
            margin: 0; /* Remove default margins */
            text-align: center;
        }

        /* Image scaling and optional rotation */
        .scaled-image {
            max-width: 100%; /* Responsive scaling */
            height: auto; /* Maintains aspect ratio */
            display: block; /* Ensures proper alignment */
            /* transform: rotate(90deg); */ /* Uncomment for rotation */
        }

		.scaled-image-large {
            max-width: 500px; /* Larger image */
        }

		.image-wrapper-large {
            width: 500px; /* Container matches image size */
            height: 400px; /* Adjusted for rotated image (assuming 4:5 aspect ratio) */
        }

        .scaled-image-medium {
            max-width: 400px; /* Medium image (matches your original) */
        }

		.image-wrapper-medium {
            width: 400px;
            height: auto; /* Adjusted for rotated image */
        }

        .scaled-image-small {
            max-width: 300px; /* Smaller image */
        }

		.image-wrapper-small {
            width: 300px;
            height: 400; /* Adjusted for rotated image */
        }

        /* Caption styling */
        figcaption {
            font-size: 0.9em;
            color: #555;
            margin-top: 0.5em;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .image-container {
                gap: 1rem; /* Smaller gap on mobile */
            }
            figure {
                max-width: 100%; /* Full width on mobile */
            }
        }
    	</style>
	</head>
	<body class="is-preload">

		<!-- Header -->
			<div id="header">

				<div class="top">

					<!-- Logo -->
						<div id="logo">
							<span class="image avatar48"><img src="{{ '/images/myphoto.jpg' | relative_url }}" alt="" /></span>
							<h1 id="title">Michael Lagana</h1>
							<p>Engineer, Gadgeteer, Cyber-Enthusiast</p>
						</div>

					<!-- Nav -->
						<nav id="nav">
							<ul>
								<li><a href="{{ '/#top' | relative_url }}" id="top-link"><span class="icon solid fa-home">Intro</span></a></li>
								<li><a href="{{ '/#portfolio' | relative_url }}" id="portfolio-link"><span class="icon solid fa-th">Portfolio</span></a></li>
								<li><a href="{{ '/#about' | relative_url }}" id="about-link"><span class="icon solid fa-user">About Me</span></a></li>
							</ul>
						</nav>

				</div>

				<div class="bottom">

					<!-- Social Icons -->
						<ul class="icons">
							<li><a href="https://www.linkedin.com/in/mlagana6/" class="icon brands fa-linkedin"><span class="label">LinkedIn</span></a></li>
							<li><a href="mailto:michaell92601@gmail.com" class="icon solid fa-envelope"><span class="label">Email</span></a></li>
						</ul>

				</div>

			</div>

		<!-- Main -->
			<div id="main">
                {{ content }}
			</div>

		<!-- Footer -->
			<div id="footer">
				<p>Last updated August 2025. Based on Prologue from HTML5 UP</p>
			</div>

		<!-- Scripts -->
			<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/jquery.scrolly.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/jquery.scrollex.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/util.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

	</body>
</html>
