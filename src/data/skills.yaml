# ═══════════════════════════════════════════════════════════════════════════════
# TOOLS & SKILLS — the only place a tool is defined, and where you say which projects
# used it. Project pages, the Projects filter and the home page's "used in N projects"
# counts all come from the `projects:` lists below.
#
#   projects:  project slugs (keys in projects.yaml). Add/remove a slug to change where a
#              tool shows up. Leave it [] for tools you know but haven't documented yet.
#   resume:    true = listed in the Skills section of /resume.
#   aliases:   other spellings `npm run new` will accept.
#
# To remove a tool entirely, delete its block (and its id from experience.yaml if used there).
# ═══════════════════════════════════════════════════════════════════════════════

