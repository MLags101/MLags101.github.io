# ═══════════════════════════════════════════════════════════════════════════════
# PROJECTS — every fact about every project lives here.
#
# Edit dates, specs, featured picks, etc. in this file (tools: src/data/skills.yaml). The write-up (text,
# photos, videos, 3D) for each project is in src/content/projects/<slug>/index.mdx and
# its images/ folder. The key above each block (e.g. `eevi:`) is the slug: it is the
# URL (/projects/eevi) and must match the folder name.
#
# Dates are YYYY-MM. Leave `end` out for ongoing work. A typo here fails the build
# with a message naming the field, so mistakes can't reach the live site.
# Full field reference: docs/CONTENT.md · Overview: SITE_GUIDE.md
# ═══════════════════════════════════════════════════════════════════════════════

# ── TEAMS & ORGS ──────────────────────────────────────────────────────────────

eevi:
  title: EEVi — URC Scout Drone
  summary: >-
    RoboNav's scout drone for the University Rover Challenge, rebuilt for 2025 with an
    auto-tracking antenna, RFD900x telemetry and digital video.
  category: team   # research | professional | team | personal | coursework
  start: 2023-10   # YYYY-MM
  end: 2026-05   # YYYY-MM — leave out while ongoing
  status: complete   # complete | in-progress | paused | concept
  featured: true   # true = shown on the home page
  order: 90   # higher = earlier among featured / ties
  role: Founder & Drone Lead
  context: robonav   # experience id (src/data/experience.yaml)
  team: RoboNav drone subteam — 2 members in 2024, 10+ on EEVi v3
  cover: 20250530-085411.jpg   # file in src/content/projects/<slug>/images/
  coverAlt: EEVi and the RoboNav rover on the Utah desert course at URC 2025
  specs:
    - { label: Flight ctrl, value: Pixhawk · ArduPilot }
    - { label: Airframe, value: Scrapped Tarot carbon fiber + printed shell }
    - { label: Telemetry, value: RFD900x radio pair }
    - { label: Video, value: OpenHD digital · Pi 4 + Arducam }
    - { label: Ground, value: 2-axis auto-tracking antenna }
    - { label: Range gain, value: +2 km from tracking antenna }
    - { label: Video lag, value: ~0.5 s at URC 2025 }
    - { label: Events, value: URC 2024 · URC 2025 }
  related: [typhoon-bgc]
  log:   # dated build milestones
    - { date: 2023-10, title: Drone subteam founded, note: "Two members, a box of parts from a retired drone, and a brief to support the rover." }
    - { date: 2024-05, title: URC 2024 — first competition, note: Pixhawk build with a tool-carrying end effector. Telemetry range came up short and a bad wire killed video at the event. }
    - { date: 2025-05, title: URC 2025 — full rebuild, note: "New carbon airframe, tracking antenna and digital video. Autonomous takeoff and stable flight; lost to terrain with all electronics intact." }
    - { date: 2026-02, title: EEVi v3 in development, note: Team grown to 10+. Typhoon brushless gimbal controller boards integrated. }

