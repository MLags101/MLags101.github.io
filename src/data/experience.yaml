  mark: ARL
  location: Atlanta, GA
  type: research
  start: 2025-08
  positions:
    - { title: Undergraduate Researcher }
  summary: >-
    Building the vehicles the lab's autonomy research flies on — motion-capture-tracked
    quadcopter testbeds for swarm work, and a small underwater vehicle for manipulation.
  highlights:
