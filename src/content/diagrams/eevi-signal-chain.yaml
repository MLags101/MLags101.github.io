title: EEVi 2025 communications architecture
description: >-
  Telemetry and video paths from the aircraft to the ground station. A Pixhawk streams
  MAVLink over RFD900x radios; a Raspberry Pi 4 running OpenHD sends digital video from an
  Arducam over Wi-Fi. Both links land on an Intel NUC at the auto-tracking antenna, which
  relays them to the ground station.
